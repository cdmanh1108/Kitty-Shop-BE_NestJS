name: CI

on:
  # Automatic CI is paused. Run manually from the Actions tab when needed.
  workflow_dispatch:
  # push:
  #   branches: ['**']
  # pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rental_shop_test
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental -d rental_shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rental:rental@localhost:5432/rental_shop_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-at-least-32-characters-long
      WEB_JWT_ACCESS_SECRET: ci-only-web-jwt-access-secret-32-chars-minimum
      AUTH_OTP_HASH_SECRET: ci-only-otp-hash-secret-32-chars-minimum
      DEFAULT_ADMIN_PASSWORD: CI-Only-Password-123!
      SWAGGER_ENABLED: 'true'
      DB_AUTO_START: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
        if: ${{ hashFiles('package-lock.json') != '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
        if: ${{ hashFiles('package-lock.json') == '' }}
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run quality
      - name: Verify OpenAPI contract freshness
        run: npm run openapi:check
