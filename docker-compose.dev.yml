services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      POSTGRES_DB: rental_shop
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - kitty-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rental -d rental_shop']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  kitty-postgres-data:
