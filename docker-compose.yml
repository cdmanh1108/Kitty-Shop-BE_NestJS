services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_shop
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
    ports:
      - '5432:5432'
    volumes:
      - rental_shop_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rental -d rental_shop']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  rental_shop_postgres:
